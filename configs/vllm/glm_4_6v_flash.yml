name: GLM-4.6V-Flash
org: Z.ai
model_id: zai-org/GLM-4.6V-Flash
model_family: glmv
model_type: open
model_size: 9B
backend: vllm
model_args:
  dtype: bfloat16
  trust_remote_code: true
  max_model_len: 16384
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  enforce_eager: true
generation:
  max_new_tokens: 8192
  temperature: 0.0
  top_p: 1.0
postprocessing:
  steps:
    - name: replace
      args:
        pattern: "^(?:<think>\\s*)?.*?</think>\\s*"
        replacement: ""
        flags:
          - dotall
