[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "povisle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "python-dotenv>=1.2.2",
    "huggingface-hub>=1.13.0",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "urllib3>=2.0.0",
    "openai>=2.33.0",
    "stamina>=26.1.0",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.11.0; sys_platform == 'linux'",
]

[tool.uv.pip]
torch-backend = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["povisle*"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
